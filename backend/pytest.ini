[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# ============================================================
#  Phase 6 新增: 覆盖率 & JUnit 报告 (pytest-cov + pytest 内置)
#  默认行为：
#    -v                       每个用例打印 PASS/FAIL 行
#    --strict-markers         禁止 @pytest.mark.xxx 使用未注册的 marker
#    -ra                      最后汇总除 PASS 外的所有结果
#    --cov app                统计 app 包的覆盖率
#    --cov-report term-miss   终端输出中显示未覆盖到的行号
#    --cov-report html        生成 htmlcov/index.html 可视化报告
#    --cov-report xml         CI artifact (reports/coverage.xml)
#    --junitxml               CI artifact (reports/test-results.xml)
#  临时跳过覆盖率:
#    pytest tests/phases/ --no-cov   (Phase 冒烟脚本更关注本身的 PASS/FAIL 统计)
# ============================================================
markers =
    asyncio: 标记异步测试用例（pytest-asyncio）
    load: 负载/并发测试用例，日常默认跳过，CI 手动触发
    slow: 执行时间较长的用例（>10s），日常冒烟可加 -m "not slow" 跳过
    fuzz: schemathesis 契约 Fuzz 测试，日常/CI 默认跳过，手动 nightly 跑 pytest -m fuzz
    demo: 效果演示/手工验收用例（如混合检索 DEMO），默认 -m "not demo" 跳过
    parametrize: 内置参数化 marker
    usefixtures: 内置 fixture 注入 marker

addopts =
    -v
    --strict-markers
    -ra
    --ff
    --nf
    # ============================================================
    #  PHASE7-P0 · 默认跳过「高耗时/演示类」marker
    #  - fuzz:   schemathesis 契约 Fuzz（每个 endpoint 5-100 cases，10min+）
    #  - demo:   效果演示脚本（如混合检索 DEMO，需真 LLM/Embedding）
    #  - slow:   单条 >10s 的重度用例
    #  - load:   并发/压测用例（真并发打接口）
    #  日常默认不跑；要跑时显式:
    #    pytest -m fuzz          (跑所有 Fuzz)
    #    pytest -m demo          (跑 DEMO 用例)
    #    pytest -m "not not fuzz" (等价默认，其实不用写)
    # ============================================================
    -m "not fuzz and not demo and not slow and not load"
    --cov=app
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml:reports/coverage.xml
    --junitxml=reports/test-results.xml
