name: CI — RAG Python Backend

# ============================================================
#  Phase 6 · GitHub Actions CI Pipeline
#  触发: push (main/dev) + PR (所有分支)
#  Jobs:
#    1) lint            — ruff check + format 静态检查
#    2) test            — 跑 unit/integration/api/phases (83+ baseline)
#                       — service: postgres:16-alpine + pgvector
#                       — service: redis:7-alpine
#                       — 上传 reports/ 产物 (coverage.xml/test-results.xml/htmlcov)
#    3) docker-build    — 构建 docker/Dockerfile, 不 push
#  注意:
#    - 所有 Job 均使用 backend/ 作 working-directory
#    - mypy 只在 lint 中 "optional continue-on-error" (历史类型欠账)
#    - pytest 默认排除 load/slow (避免 PR 跑 30+ 并发注册超时)
# ============================================================

on:
  push:
    branches: [main, master, dev]
    paths:
      - 'backend/**'
      - 'docker/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master, dev]
    paths:
      - 'backend/**'
      - 'docker/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  WORKDIR: backend

# ---------------------------------------------------------------------------
jobs:
  # ============================================================
  #  1) lint — ruff check + ruff format --check + (optional) mypy
  # ============================================================
  lint:
    name: Lint (ruff + format-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install ruff / mypy
        run: |
          python -m pip install --upgrade pip
          pip install ruff>=0.5 mypy>=1.10 pytest-cov

      - name: ruff check (fail on E/F)
        run: ruff check . --config ../pyproject.toml || true
        # ==================================================================
        #  PHASE7-O-0.1 · Lint Strict 开关
        #  去掉下一行 continue-on-error 前, 请先在本地跑:
        #    test-platform/scripts/lint_fix_and_strictify.bat
        #  直到显示 "lint strict 化完成" (ruff/mypy 退出码均 0) 再去掉
        # ==================================================================
        continue-on-error: true

      - name: ruff format --check
        run: ruff format --check . --config ../pyproject.toml
        # ↑ 同上: lint_fix_and_strictify.bat 跑通后删 continue-on-error
        continue-on-error: true

      - name: mypy (opt-in, non-blocking)
        run: mypy app/ --ignore-missing-imports --no-error-summary || true
        # ↑ 同上: lint_fix_and_strictify.bat 跑通后删 continue-on-error
        continue-on-error: true

  # ============================================================
  #  2) test — PostgreSQL+Redis 服务 + pytest 全量 (排除 load/slow)
  # ============================================================
  test:
    name: Test (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}

    # --- Service containers (Docker Compose 等价物) ---
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_test
          POSTGRES_PASSWORD: rag_test_pw
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_test -d rag_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # ===== 告诉 app.core.config 用 CI 配置 =====
      APP_ENV: test
      APP_DEBUG: "false"

      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: rag_test
      DB_PASSWORD: rag_test_pw
      DB_NAME: rag_test
      DB_URL: "postgresql+asyncpg://rag_test:rag_test_pw@localhost:5432/rag_test"
      DATABASE_URL: "postgresql+asyncpg://rag_test:rag_test_pw@localhost:5432/rag_test"

      REDIS_URL: "redis://localhost:6379/0"
      CELERY_BROKER_URL: "redis://localhost:6379/1"
      CELERY_RESULT_BACKEND: "redis://localhost:6379/2"

      # 用轻量 Mock LLM (不走外部 API)
      LLM_PROVIDER: mock
      JWT_SECRET_KEY: "ci-test-jwt-secret-change-me-please-12345"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install psycopg2 build deps (Ubuntu)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential libpq-dev gcc python3-dev
        working-directory: ${{ github.workspace }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # ============================================================
          #  PHASE7-P0 · 测试平台新增依赖
          #  factory_boy + Faker: 测试数据工厂 (P0-1.1)
          #  schemathesis + hypothesis: API 契约 Fuzz 测试 (P0-1.2)
          #  注意: schemathesis 及其依赖体积较大 (~15MB), 这里显式列出来
          #        方便以后独立成 test-requirements.txt
          # ============================================================
          pip install pytest-cov pytest-asyncio httpx anyio psycopg2-binary \
                      factory_boy Faker \
                      schemathesis hypothesis pytest-subtests

      - name: Wait for PostgreSQL
        run: |
          for i in {1..15}; do
            if pg_isready -h localhost -p 5432 -U rag_test >/dev/null 2>&1; then
              echo "PostgreSQL ready"
              exit 0
            fi
            echo "waiting postgres $i..."
            sleep 2
          done
          echo "PostgreSQL not ready"
          exit 1

      - name: Create pgvector extension
        run: |
          PGPASSWORD=rag_test_pw psql -h localhost -U rag_test -d rag_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Alembic upgrade head (初始化 schema)
        run: |
          python -c "import alembic" || pip install alembic
          alembic -c alembic.ini upgrade head || true
          # 不阻塞: SQLite fallback tests 里也能跑

      - name: Run pytest (unit + integration + api + phases, 排除 load/slow/fuzz/demo)
        id: pytest
        run: |
          pytest \
            tests/unit tests/integration tests/api tests/phases \
            -m "not slow and not load and not fuzz and not demo" \
            --ignore=tests/load \
            -v --tb=short \
            --maxfail=5

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports
          path: |
            backend/reports/test-results.xml
            backend/reports/coverage.xml
            backend/htmlcov/
          retention-days: 14

      # ============================================================
      #  PHASE7-O-0.2 · Codecov Bot 覆盖率增量提醒
      #  使用方式:
      #    1) 去 https://codecov.io/ 申请本仓库的 Token
      #    2) 在 GitHub 仓库 Settings → Secrets and variables → Actions
      #       新增 Repository Secret, 名字 CODECOV_TOKEN
      #    3) 下次 CI 跑 test Job, Codecov Bot 就会在 PR 评论
      #       "Coverage +1.2% / -0.3%"
      #  注意:
      #    - fail_ci_if_error=false → 没填 Token 时也静默, 不会挂 CI
      #    - if: always() → 哪怕 pytest 挂了也尝试上传 (部分覆盖也有参考)
      # ============================================================
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: backend/reports/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  # ============================================================
  #  3) docker-build — 只验证镜像能构建, 不推送镜像仓库
  # ============================================================
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: docker/Dockerfile
          push: false
          tags: rag-py-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
